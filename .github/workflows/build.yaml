name: 'Build and push'

# Deliberately NOT scheduled. The image pins an exact Mesa version, so a nightly run would
# either be a no-op or -- once the PPA publishes a newer version and the pin stops matching
# -- a daily failure. Re-pinning is a deliberate act; this fires on push and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - 'channels.txt'
      - '.github/workflows/build.yaml'
  workflow_dispatch:
    inputs:
      mesa_channel:
        description: 'Mesa channel (see channels.txt for what each one pins)'
        type: choice
        options:
          - kisak
          - mesarc
        default: kisak

concurrency:
  group: build-push
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: 'Build and push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Everything about the Mesa source is derived here from channels.txt, so a version
      # string exists in exactly one place in this repo. The step also decides the tags,
      # which means a tag can never disagree with what was installed.
      - name: 'Resolve channel and tags'
        id: tags
        env:
          # Empty on a push event -- workflow_dispatch inputs do not exist there. Resolved
          # below to whichever row is marked stable, so a push always builds the stable line.
          WANT: ${{ inputs.mesa_channel }}
        run: |
          set -euo pipefail
          ./resolve-channel.sh "${WANT}" >> "$GITHUB_OUTPUT"
          echo "--- resolved ---"
          cat "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build and push'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          build-args: |
            MESA_PPA=${{ steps.tags.outputs.ppa }}
            MESA_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin deployments to the digest, not the tag. Printing it here saves digging it out
      # of the package UI on every re-pin.
      - name: 'Report what shipped'
        run: |
          set -euo pipefail
          {
            echo '### Image'
            echo
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo '### Build inputs'
            echo
            echo "- Channel: \`${{ steps.tags.outputs.channel }}\`"
            echo "- MESA_PPA: \`${{ steps.tags.outputs.ppa }}\`"
            echo "- MESA_VERSION: \`${{ steps.tags.outputs.version }}\`"
            echo "- Tags: \`${{ steps.tags.outputs.list }}\`"
            echo
            echo 'Mesa actually installed, read back out of the image:'
            echo
            echo '```'
            docker run --rm --entrypoint cat \
              "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" \
              /etc/tdarr-node-mesa-fresh.build
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
