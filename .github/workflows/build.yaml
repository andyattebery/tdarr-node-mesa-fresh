name: 'Build and push'

# Deliberately NOT scheduled. Each channel pins an exact Mesa version, so a nightly run would
# either be a no-op or -- once a PPA publishes a newer version and the pin stops matching --
# a daily failure. Re-pinning is a deliberate act; this fires on push and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - 'channels.txt'
      - 'resolve-channel.sh'
      - '.github/workflows/build.yaml'
  workflow_dispatch:
    inputs:
      mesa_channel:
        description: 'Which channel to build (see channels.txt)'
        type: choice
        options:
          - all
          - kisak
          - mesarc
        default: all

concurrency:
  group: build-push
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Turn channels.txt into the matrix. A push has no inputs, so it builds everything.
  resolve:
    name: 'Resolve channels'
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.list.outputs.channels }}
    steps:
      - uses: actions/checkout@v7

      - name: 'List channels'
        id: list
        env:
          WANT: ${{ inputs.mesa_channel }}
        run: |
          set -euo pipefail
          if [ -z "${WANT}" ] || [ "${WANT}" = all ]; then
            channels=$(./resolve-channel.sh --list)
          else
            # Validate the name against the file rather than trusting the dropdown, which is a
            # static literal list and can drift from channels.txt.
            ./resolve-channel.sh "${WANT}" >/dev/null
            channels="[\"${WANT}\"]"
          fi
          echo "channels=${channels}" >> "$GITHUB_OUTPUT"
          echo "Building: ${channels}"

  build:
    name: 'Build ${{ matrix.channel }}'
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      # Channels are independent. mesarc tracks a moving branch, so its pin is expected to go
      # stale and fail; that must not cancel a perfectly good kisak build.
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.resolve.outputs.channels) }}
    steps:
      - uses: actions/checkout@v7

      # Everything about the Mesa source is derived here from channels.txt, so a version
      # string exists in exactly one place in this repo. The step also decides the tags,
      # which means a tag can never disagree with what was installed.
      - name: 'Resolve ${{ matrix.channel }}'
        id: tags
        run: |
          set -euo pipefail
          ./resolve-channel.sh "${{ matrix.channel }}" >> "$GITHUB_OUTPUT"
          echo "--- resolved ---"
          cat "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build and push'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          build-args: |
            MESA_PPA=${{ steps.tags.outputs.ppa }}
            MESA_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          # Scope the cache per channel: the two share every layer up to the Mesa install and
          # nothing after it, so one key would have them evicting each other.
          cache-from: type=gha,scope=${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=${{ matrix.channel }}

      # Pin deployments to the digest, not the channel tag. Printing it here saves digging it
      # out of the package UI on every re-pin.
      - name: 'Report what shipped'
        run: |
          set -euo pipefail
          {
            echo "### ${{ matrix.channel }}"
            echo
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "- MESA_PPA: \`${{ steps.tags.outputs.ppa }}\`"
            echo "- MESA_VERSION: \`${{ steps.tags.outputs.version }}\`"
            echo "- Tags: \`${{ steps.tags.outputs.list }}\`"
            echo
            echo 'Mesa actually installed, read back out of the image:'
            echo
            echo '```'
            docker run --rm --entrypoint cat \
              "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" \
              /etc/tdarr-node-mesa-fresh.build
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
