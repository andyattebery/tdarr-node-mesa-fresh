name: 'Build and push'

# Scheduled, because neither pin is hand-maintained any more. refresh-channels.py writes
# whatever each PPA currently has installable on noble/amd64, and refresh-base.py writes
# whatever the upstream :latest tag resolves to. The run then builds only what moved -- the
# channels whose Mesa changed, or ALL channels if the base changed, since a new base changes
# every image. Most days nothing moves, and a run that builds nothing is a success.
#
# The refresh and the build deliberately share one run. A push made with GITHUB_TOKEN does not
# trigger `on: push`, so a bot commit to channels.txt or base.txt cannot kick off a build of
# its own -- the run that writes the pins has to be the run that builds them.
on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - 'channels.txt'
      - 'base.txt'
      - 'resolve-channel.sh'
      - 'resolve-base.sh'
      - 'refresh-channels.py'
      - 'refresh-base.py'
      - '.github/workflows/build.yaml'
  workflow_dispatch:
    inputs:
      mesa_channel:
        description: 'Which channel to build (see channels.txt)'
        type: choice
        options:
          - all
          - kisak
          - mesarc
        default: all
      refresh:
        description: 'Refresh the PPA pins and the base image first, then build only what moved (ignores the channel above)'
        type: boolean
        default: false

concurrency:
  group: build-push
  cancel-in-progress: false

permissions:
  # write, not read: the refresh commits channels.txt and base.txt back to the branch.
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Decide what to build, and -- in refresh mode -- move the pins first.
  resolve:
    name: 'Resolve what to build'
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.list.outputs.channels }}
      sha: ${{ steps.list.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      # Refresh mode is `schedule` or a dispatch with refresh=true. The dispatch exists so this
      # path can be rehearsed without waiting for cron, so it must behave exactly as cron does --
      # which is why it ignores mesa_channel and builds only what moved.
      - name: 'Refresh pins from the PPAs and upstream'
        id: refresh
        if: github.event_name == 'schedule' || inputs.refresh
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Both, always, and in one commit -- they are two halves of the same daily question
          # ("is anything we build on newer than what we pinned?") and splitting them would
          # put two commits on the branch for one run's worth of change.
          changed="$(python3 refresh-channels.py --write)"    # JSON array, e.g. ["kisak"]
          base_new="$(python3 refresh-base.py --write)"       # "2.87.01", or empty
          echo "changed=${changed}"   >> "$GITHUB_OUTPUT"
          echo "base_new=${base_new}" >> "$GITHUB_OUTPUT"

          msg=''
          if [ "${changed}" != '[]' ]; then
            msg="channels: follow PPAs for $(echo "${changed}" | tr -d '[]\"' | tr ',' ' ')"
          fi
          if [ -n "${base_new}" ] && [ -n "${msg}" ]; then
            msg="${msg}; base -> ${base_new}"
          elif [ -n "${base_new}" ]; then
            msg="base: follow upstream -> ${base_new}"
          fi
          if [ -z "${msg}" ]; then
            echo "Nothing moved; nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channels.txt base.txt
          git commit -m "${msg}"
          # Push BEFORE anything is built or published, and to an explicit refspec because
          # actions/checkout leaves a detached HEAD. If a human pushed while this run was in
          # flight the push is rejected and the run fails having shipped nothing; the next run
          # redoes the refresh from the new tip. That is preferred to forcing.
          git push origin "HEAD:${BRANCH}"

      - name: 'List channels'
        id: list
        env:
          WANT: ${{ inputs.mesa_channel }}
          REFRESHED: ${{ github.event_name == 'schedule' || inputs.refresh }}
          CHANGED: ${{ steps.refresh.outputs.changed }}
          BASE_NEW: ${{ steps.refresh.outputs.base_new }}
        run: |
          set -euo pipefail
          if [ "${REFRESHED}" = true ] && [ -n "${BASE_NEW}" ]; then
            # A new base is under every channel, so every channel is stale -- including one
            # held in channels.txt, because `hold` freezes a Mesa version, not the image.
            channels=$(./resolve-channel.sh --list)
            echo "Base moved to ${BASE_NEW}: rebuilding every channel."
          elif [ "${REFRESHED}" = true ]; then
            channels="${CHANGED:-[]}"
            echo "Base unchanged; building only the channels whose Mesa moved."
          elif [ -z "${WANT}" ] || [ "${WANT}" = all ]; then
            channels=$(./resolve-channel.sh --list)
          else
            # Validate the name against the file rather than trusting the dropdown, which is a
            # static literal list and can drift from channels.txt.
            ./resolve-channel.sh "${WANT}" >/dev/null
            channels="[\"${WANT}\"]"
          fi
          echo "channels=${channels}" >> "$GITHUB_OUTPUT"
          # The build job checks this out rather than github.sha, which on a refresh run is the
          # tip from before the commit above -- it would build the previous pin.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building: ${channels}"

  build:
    name: 'Build ${{ matrix.channel }}'
    needs: resolve
    # A refresh that moved nothing yields []. Without this guard that is a hard error --
    # "Matrix vector 'channel' does not contain any values" -- not a skip, and since most
    # scheduled runs move nothing, this is what keeps the everyday run green.
    if: needs.resolve.outputs.channels != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Channels are independent. A PPA can publish a build that trips one of the Containerfile's
      # gates; that must not cancel a perfectly good build of the other one.
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.resolve.outputs.channels) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # One step, both files: resolve-channel.sh reads channels.txt and calls resolve-base.sh
      # for base.txt, so each version string exists in exactly one place in this repo. It also
      # decides the tags, which is why a tag can never disagree with what was built.
      - name: 'Resolve ${{ matrix.channel }}'
        id: tags
        run: |
          set -euo pipefail
          ./resolve-channel.sh "${{ matrix.channel }}" >> "$GITHUB_OUTPUT"
          echo "--- resolved ---"
          cat "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build and push'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.tags.outputs.base_image }}
            TDARR_VERSION=${{ steps.tags.outputs.tdarr_version }}
            MESA_PPA=${{ steps.tags.outputs.ppa }}
            MESA_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          # Scope the cache per channel: the two share every layer up to the Mesa install and
          # nothing after it, so one key would have them evicting each other.
          cache-from: type=gha,scope=${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=${{ matrix.channel }}

      # Pin deployments to the digest, not the channel tag. Printing it here saves digging it
      # out of the package UI on every re-pin.
      - name: 'Report what shipped'
        run: |
          set -euo pipefail
          held=''
          if [ '${{ steps.tags.outputs.base_held }}' = true ]; then
            # Worth saying out loud: a held base means this image is deliberately NOT on
            # upstream's newest, and that should not look like an ordinary build.
            held=' **(held)**'
          fi
          {
            echo "### ${{ matrix.channel }}"
            echo
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "- MESA_PPA: \`${{ steps.tags.outputs.ppa }}\`"
            echo "- MESA_VERSION: \`${{ steps.tags.outputs.version }}\`"
            echo "- Base: \`${{ steps.tags.outputs.base_image }}\`"
            echo "- Tdarr: \`${{ steps.tags.outputs.tdarr_version }}\`${held}"
            echo "- Tags: \`${{ steps.tags.outputs.list }}\`"
            echo
            echo 'Build stamp. The Mesa version is read back from dpkg inside the image;'
            echo 'the rest are the inputs it was built with:'
            echo
            echo '```'
            docker run --rm --entrypoint cat \
              "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" \
              /etc/tdarr-node-mesa-fresh.build
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
